<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPlatform - Anmelden</title>
    <meta name="description" content="Melden Sie sich bei CampusPlatform an – Ihrem digitalen Campus-Portal.">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body class="light-mode">
    <div class="login-page">
        <!-- Theme Toggle -->
        <button id="theme-toggle" class="login-theme-toggle" type="button" aria-label="Dunkles Design aktivieren">
            <span class="material-icons-round" aria-hidden="true">dark_mode</span>
        </button>

        <!-- Decorative Background Elements -->
        <div class="login-bg-decoration" aria-hidden="true">
            <div class="login-bg-circle login-bg-circle--1"></div>
            <div class="login-bg-circle login-bg-circle--2"></div>
            <div class="login-bg-circle login-bg-circle--3"></div>
        </div>

        <!-- Login Card -->
        <main class="login-card" role="main">
            <div class="login-header">
                <div class="login-brand">
                    <span class="material-icons-round login-logo" aria-hidden="true">school</span>
                    <span class="login-brand-name">CampusPlatform</span>
                </div>
                <h1 id="login-title">Willkommen</h1>
                <p class="login-subtitle">Bitte melden Sie sich mit Ihren Zugangsdaten an</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Matrikelnummer / E-Mail</label>
                    <div class="input-wrapper">
                        <span class="material-icons-round input-icon" aria-hidden="true">person</span>
                        <input type="text" id="username" placeholder="12345678" required autocomplete="username" aria-required="true">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <div class="input-wrapper">
                        <span class="material-icons-round input-icon" aria-hidden="true">lock</span>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" aria-required="true">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-login">
                    <span class="btn-text">Anmelden</span>
                    <span class="material-icons-round btn-icon" aria-hidden="true">arrow_forward</span>
                </button>
                <a href="#" class="forgot-password">Passwort vergessen?</a>
            </form>

            <footer class="login-footer">
                <p>&copy; 2025 CampusPlatform</p>
            </footer>
        </main>
    </div>

    <script type="module">
        // Theme Management
        (function initTheme() {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const body = document.body;

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                body.classList.remove('light-mode');
                body.classList.add(savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    body.classList.remove('light-mode');
                    body.classList.add('dark-mode');
                }
            }
            updateThemeIcon();

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    const isDark = body.classList.contains('dark-mode');
                    body.classList.replace(
                        isDark ? 'dark-mode' : 'light-mode',
                        isDark ? 'light-mode' : 'dark-mode'
                    );
                    localStorage.setItem('theme', isDark ? 'light-mode' : 'dark-mode');
                    updateThemeIcon();
                });
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    body.classList.replace(
                        e.matches ? 'light-mode' : 'dark-mode',
                        e.matches ? 'dark-mode' : 'light-mode'
                    );
                    updateThemeIcon();
                }
            });

            function updateThemeIcon() {
                if (!themeToggleBtn) return;
                const iconSpan = themeToggleBtn.querySelector('span');
                const isDark = body.classList.contains('dark-mode');
                iconSpan.textContent = isDark ? 'light_mode' : 'dark_mode';
                themeToggleBtn.setAttribute('aria-label', isDark ? 'Helles Design aktivieren' : 'Dunkles Design aktivieren');
            }
        })();

        // Redirect if already logged in
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.replace('index.html');
        }

        // Login Form Handling
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');

        if (usernameInput) {
            setTimeout(() => usernameInput.focus(), 300);
        }

        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                const btnText = submitBtn?.querySelector('.btn-text');
                const btnIcon = submitBtn?.querySelector('.btn-icon');

                if (submitBtn) {
                    if (btnText) btnText.textContent = 'Wird angemeldet...';
                    if (btnIcon) btnIcon.textContent = 'hourglass_empty';
                    submitBtn.disabled = true;
                    submitBtn.setAttribute('aria-busy', 'true');
                    submitBtn.classList.add('btn-loading');
                }

                setTimeout(() => {
                    sessionStorage.setItem('isLoggedIn', 'true');

                    // Fade out the login card
                    const loginCard = document.querySelector('.login-card');
                    if (loginCard) {
                        loginCard.style.opacity = '0';
                        loginCard.style.transform = 'translateY(-10px) scale(0.98)';
                        loginCard.style.transition = 'opacity 0.4s ease-out, transform 0.4s ease-out';
                    }

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 400);
                }, 1000);
            });
        }
    </script>
</body>

</html>
